services:
  # ========================================================
  # 1. Backend Express API (Web Service)
  # ========================================================
  - type: web
    name: pureframe-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pureframe-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_WIDGET_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ========================================================
  # 2. Frontend React / Vite (Static Site)
  # ========================================================
  - type: web
    name: pureframe-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # SPA rewrite rule for client-side routing (LocalityPage, ProfilePage, etc.)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pureframe-api.onrender.com

# ========================================================
# 3. PostgreSQL Database
# ========================================================
databases:
  - name: pureframe-postgres
    plan: free
    databaseName: pureframe_db
    user: pureframe_user
